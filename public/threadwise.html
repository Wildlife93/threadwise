<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <title>Threadwise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f14;
      --surface: #17171f;
      --surface2: #1e1e28;
      --surface3: #252532;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --accent: #7c6af7;
      --accent2: #a594f9;
      --accent-dim: rgba(124,106,247,0.15);
      --accent-glow: rgba(124,106,247,0.35);
      --text: #e8e8f0;
      --text2: #9090a8;
      --text3: #5a5a72;
      --green: #4caf82;
      --green-dim: rgba(76,175,130,0.15);
      --red: #f07070;
      --msg-out: #2a2540;
      --msg-out-border: rgba(124,106,247,0.25);
      --msg-in: #1e1e28;
      --radius: 18px;
      --radius-sm: 10px;
      --font: 'DM Sans', sans-serif;
      --font-display: 'Playfair Display', serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    html, body { height: 100%; overflow: hidden; background: var(--bg); }

    body {
      font-family: var(--font);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    #root { height: 100%; display: flex; flex-direction: column; }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

    /* ── Layout ── */
    .app { display: flex; height: 100vh; height: 100dvh; padding-top: var(--safe-top); }

    /* ── Sidebar ── */
    .sidebar {
      width: 320px; min-width: 320px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      transition: transform 0.3s cubic-bezier(.4,0,.2,1);
    }

    .sidebar-header {
      padding: 20px 20px 0;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .logo {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 22px;
      color: var(--accent2);
      letter-spacing: -0.5px;
      flex: 1;
    }

    .avatar-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1.5px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 14px; font-weight: 600; color: var(--accent2);
      transition: background 0.2s;
      position: relative;
    }
    .avatar-btn:hover { background: var(--accent-glow); }

    .status-dot {
      position: absolute; bottom: 0; right: 0;
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--green);
      border: 2px solid var(--surface);
    }

    .search-wrap {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .search-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 14px 9px 36px;
      color: var(--text);
      font-family: var(--font);
      font-size: 13.5px;
      outline: none;
      transition: border-color 0.2s;
      position: relative;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text3); }

    .search-wrap-inner {
      position: relative;
    }
    .search-icon {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      color: var(--text3); font-size: 14px; pointer-events: none;
    }

    .chat-list { flex: 1; overflow-y: auto; }

    .chat-list-section {
      padding: 8px 0;
    }

    .section-label {
      padding: 6px 18px;
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text3);
    }

    .chat-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
    }
    .chat-item:hover { background: var(--surface2); }
    .chat-item.active {
      background: var(--accent-dim);
      border-left-color: var(--accent);
    }

    .chat-avatar {
      width: 42px; height: 42px; min-width: 42px;
      border-radius: 50%;
      background: var(--surface3);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 600;
      color: var(--text2);
      position: relative;
    }

    .online-dot {
      position: absolute; bottom: 1px; right: 1px;
      width: 9px; height: 9px;
      border-radius: 50%; background: var(--green);
      border: 2px solid var(--surface);
    }

    .chat-meta { flex: 1; min-width: 0; }
    .chat-name {
      font-size: 14px; font-weight: 500;
      color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .chat-preview {
      font-size: 12.5px; color: var(--text3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 2px;
    }

    .chat-time-badge { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .chat-time { font-size: 11px; color: var(--text3); white-space: nowrap; }
    .unread-badge {
      background: var(--accent);
      color: #fff;
      font-size: 10px; font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px;
      min-width: 18px; text-align: center;
    }

    .new-chat-btn {
      margin: 12px 16px;
      padding: 10px;
      background: var(--accent-dim);
      border: 1px dashed rgba(124,106,247,0.3);
      border-radius: var(--radius-sm);
      color: var(--accent2);
      font-family: var(--font);
      font-size: 13.5px; font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, border-color 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .new-chat-btn:hover {
      background: var(--accent-glow);
      border-color: var(--accent);
    }

    /* ── Chat View ── */
    .chat-view {
      flex: 1;
      display: flex; flex-direction: column;
      background: var(--bg);
      min-width: 0;
    }

    .chat-topbar {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
      background: var(--surface);
      min-height: 65px;
    }

    .back-btn {
      display: none;
      background: none; border: none;
      color: var(--text2); cursor: pointer;
      padding: 4px 8px 4px 0;
      font-size: 18px;
    }

    .topbar-avatar {
      width: 38px; height: 38px; min-width: 38px;
      border-radius: 50%;
      background: var(--surface3);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 600; color: var(--text2);
      position: relative;
    }

    .topbar-info { flex: 1; min-width: 0; }
    .topbar-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .topbar-status { font-size: 12px; color: var(--text3); margin-top: 1px; }
    .topbar-status.online { color: var(--green); }

    .topbar-actions { display: flex; gap: 4px; }
    .icon-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: none; border: none;
      color: var(--text2); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: background 0.15s, color 0.15s;
    }
    .icon-btn:hover { background: var(--surface2); color: var(--text); }

    /* ── Messages ── */
    .messages-area {
      flex: 1; overflow-y: auto;
      padding: 16px 20px;
      display: flex; flex-direction: column;
      gap: 4px;
    }

    .date-divider {
      text-align: center;
      margin: 12px 0 8px;
    }
    .date-divider span {
      font-size: 11px; font-weight: 500;
      color: var(--text3);
      background: var(--surface2);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeUp 0.2s ease;
    }
    .msg-row.out { flex-direction: row-reverse; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-avatar-space {
      width: 28px; min-width: 28px;
    }
    .msg-sender-avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--surface3);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600; color: var(--text2);
    }

    .msg-bubble-wrap { max-width: 68%; display: flex; flex-direction: column; gap: 2px; }
    .msg-row.out .msg-bubble-wrap { align-items: flex-end; }

    .msg-sender-name {
      font-size: 11px; color: var(--text3); font-weight: 500;
      padding: 0 10px;
      margin-bottom: 2px;
    }

    .msg-bubble {
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 14px; line-height: 1.55;
      word-break: break-word;
      position: relative;
    }

    .msg-row.in .msg-bubble {
      background: var(--msg-in);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg-row.out .msg-bubble {
      background: var(--msg-out);
      border: 1px solid var(--msg-out-border);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }

    .msg-meta {
      display: flex; align-items: center; gap: 4px;
      font-size: 10.5px; color: var(--text3);
      padding: 0 4px;
    }

    .msg-status { font-size: 12px; }
    .msg-status.sent { color: var(--text3); }
    .msg-status.read { color: var(--accent2); }

    .typing-indicator {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 0 4px;
    }
    .typing-bubble {
      background: var(--msg-in);
      border: 1px solid var(--border);
      border-radius: 16px; border-bottom-left-radius: 4px;
      padding: 10px 14px;
      display: flex; gap: 4px; align-items: center;
    }
    .typing-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text3);
      animation: typingBounce 1.2s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ── Input Area ── */
    .input-area {
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex; align-items: flex-end; gap: 10px;
    }

    .input-wrap {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 22px;
      display: flex; align-items: flex-end;
      padding: 0 4px 0 14px;
      transition: border-color 0.2s;
      min-height: 44px;
    }
    .input-wrap:focus-within { border-color: var(--accent); }

    .msg-textarea {
      flex: 1;
      background: none; border: none; outline: none;
      resize: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 8px 10px 0;
      max-height: 130px;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .msg-textarea::-webkit-scrollbar { display: none; }
    .msg-textarea::placeholder { color: var(--text3); }

    .attach-btn {
      width: 34px; height: 34px; min-width: 34px;
      border-radius: 50%;
      background: none; border: none;
      color: var(--text3); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: color 0.15s;
      margin-bottom: 5px;
    }
    .attach-btn:hover { color: var(--text); }

    .send-btn {
      width: 44px; height: 44px; min-width: 44px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 2px 12px var(--accent-glow);
    }
    .send-btn:hover { background: var(--accent2); }
    .send-btn:active { transform: scale(0.93); }
    .send-btn:disabled { background: var(--surface3); box-shadow: none; cursor: not-allowed; }

    /* ── Empty / Placeholder ── */
    .chat-empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: var(--text3); gap: 12px;
      padding: 40px;
      text-align: center;
    }
    .chat-empty .big-icon { font-size: 52px; opacity: 0.4; }
    .chat-empty h2 { font-family: var(--font-display); font-style: italic; font-size: 22px; color: var(--text2); }
    .chat-empty p { font-size: 13px; max-width: 260px; }

    /* ── Modals ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      padding: 20px;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 28px;
      width: 100%; max-width: 380px;
      animation: slideUp 0.2s cubic-bezier(.4,0,.2,1);
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal h2 {
      font-family: var(--font-display); font-style: italic;
      font-size: 22px; color: var(--text);
      margin-bottom: 6px;
    }
    .modal p { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

    .field-label {
      font-size: 12px; font-weight: 500; color: var(--text2);
      margin-bottom: 6px; display: block;
      letter-spacing: 0.04em;
    }

    .field-wrap { margin-bottom: 14px; }

    .field-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 13px;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field-input:focus { border-color: var(--accent); }
    .field-input::placeholder { color: var(--text3); }

    .btn {
      flex: 1;
      padding: 11px;
      border-radius: var(--radius-sm);
      border: none;
      font-family: var(--font);
      font-size: 14px; font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 10px var(--accent-glow);
    }
    .btn-primary:hover { background: var(--accent2); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text2);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--surface3); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      background: rgba(240,112,112,0.12);
      border: 1px solid rgba(240,112,112,0.3);
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 13px; color: var(--red);
      margin-bottom: 14px;
    }

    .success-msg {
      background: var(--green-dim);
      border: 1px solid rgba(76,175,130,0.3);
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 13px; color: var(--green);
      margin-bottom: 14px;
    }

    /* ── User ID display ── */
    .uid-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 13px;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 14px;
    }
    .uid-label { font-size: 11px; color: var(--text3); margin-bottom: 2px; }
    .uid-value { font-size: 13px; color: var(--accent2); font-weight: 500; font-family: monospace; word-break: break-all; }
    .copy-btn {
      background: none; border: none;
      color: var(--text3); cursor: pointer;
      padding: 4px; font-size: 14px;
      border-radius: 4px;
      transition: color 0.15s;
      white-space: nowrap;
    }
    .copy-btn:hover { color: var(--text); }

    /* ── Profile dropdown ── */
    .profile-menu {
      position: absolute;
      top: calc(100% + 8px); right: 0;
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 14px;
      padding: 8px;
      min-width: 200px;
      z-index: 50;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      animation: slideUp 0.15s ease;
    }
    .profile-menu-item {
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13.5px; color: var(--text2);
      cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      transition: background 0.15s, color 0.15s;
    }
    .profile-menu-item:hover { background: var(--surface2); color: var(--text); }
    .profile-menu-item.danger { color: var(--red); }
    .profile-menu-item.danger:hover { background: rgba(240,112,112,0.1); }
    .menu-divider { height: 1px; background: var(--border); margin: 4px 0; }

    /* ── Tabs ── */
    .auth-tabs {
      display: flex;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      padding: 3px;
      margin-bottom: 20px;
    }
    .auth-tab {
      flex: 1; padding: 8px;
      border-radius: 7px;
      font-size: 13.5px; font-weight: 500;
      border: none; background: none;
      color: var(--text3); cursor: pointer;
      font-family: var(--font);
      transition: background 0.15s, color 0.15s;
    }
    .auth-tab.active {
      background: var(--surface);
      color: var(--text);
    }

    /* ── Spinner ── */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: calc(80px + var(--safe-bottom));
      left: 50%; transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px; color: var(--text);
      z-index: 200;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      animation: toastIn 0.2s ease;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── Mobile ── */
    @media (max-width: 680px) {
      .sidebar {
        position: fixed; inset: 0; right: auto;
        width: 100%; min-width: unset;
        z-index: 10;
        transform: translateX(0);
      }
      .sidebar.hidden { transform: translateX(-100%); }
      .chat-view { position: fixed; inset: 0; }
      .back-btn { display: flex; }
      .chat-topbar { padding-top: calc(14px + var(--safe-top)); }
    }

    /* ── Scrolled to top indicator ── */
    .load-more-btn {
      text-align: center; padding: 8px;
    }
    .load-more-btn button {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; color: var(--text2);
      font-family: var(--font); font-size: 12px;
      padding: 5px 14px; cursor: pointer;
      transition: background 0.15s;
    }
    .load-more-btn button:hover { background: var(--surface3); }

    /* ── Config screen ── */
    .config-screen {
      height: 100vh; height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      padding: 20px;
    }
    .config-card {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 24px;
      padding: 36px 32px;
      width: 100%; max-width: 420px;
    }
    .config-card .brand {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 28px; color: var(--accent2);
      margin-bottom: 6px;
    }
    .config-card .brand-sub {
      font-size: 13px; color: var(--text3);
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut, updateProfile
} from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
import {
  getFirestore, doc, setDoc, getDoc, collection, query, where,
  orderBy, onSnapshot, addDoc, updateDoc, serverTimestamp,
  getDocs, limit, startAfter, writeBatch, increment
} from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';

// ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────────────────────

  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

// ── Init Firebase ─────────────────────────────────────────────────────────
function initFirebase() {
  try {
    app = initializeApp(FIREBASE_CONFIG);
    auth = getAuth(app);
    db = getFirestore(app);
    return true;
  } catch(e) {
    console.error(e);
    return false;
  }
}

// ── Render root ───────────────────────────────────────────────────────────
const root = document.getElementById('root');

function render() {
  if (!CONFIG_FILLED) { renderConfigScreen(); return; }
  if (!currentUser) { renderAuth(); return; }
  renderApp();
}

// ── Auth ──────────────────────────────────────────────────────────────────
let authTab = 'login';
let authLoading = false;
let authError = '';

function renderAuth() {
  const card = document.createElement('div');
  card.className = 'config-screen';
  card.innerHTML = `
    <div class="config-card">
      <div class="brand">Threadwise</div>
      <div class="brand-sub">Sign in to start messaging</div>
      <div class="auth-tabs">
        <button class="auth-tab ${authTab==='login'?'active':''}" id="tab-login">Sign in</button>
        <button class="auth-tab ${authTab==='signup'?'active':''}" id="tab-signup">Create account</button>
      </div>
      ${authError ? `<div class="error-msg">${authError}</div>` : ''}
      ${authTab === 'signup' ? `
        <div class="field-wrap">
          <label class="field-label">Display name</label>
          <input class="field-input" id="auth-name" placeholder="How others see you" autocomplete="name"/>
        </div>
      ` : ''}
      <div class="field-wrap">
        <label class="field-label">Email</label>
        <input class="field-input" id="auth-email" type="email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="field-wrap">
        <label class="field-label">Password</label>
        <input class="field-input" id="auth-pass" type="password" placeholder="••••••••" autocomplete="${authTab==='login'?'current-password':'new-password'}"/>
      </div>
      <div class="modal-actions" style="margin-top:6px;">
        <button class="btn btn-primary" id="auth-submit" ${authLoading?'disabled':''}>
          ${authLoading ? '<span class="spinner"></span>' : (authTab==='login'?'Sign in':'Create account')}
        </button>
      </div>
    </div>`;

  root.innerHTML = '';
  root.appendChild(card);

  card.querySelector('#tab-login').onclick = () => { authTab='login'; authError=''; render(); };
  card.querySelector('#tab-signup').onclick = () => { authTab='signup'; authError=''; render(); };

  const emailEl = card.querySelector('#auth-email');
  const passEl = card.querySelector('#auth-pass');

  card.querySelector('#auth-submit').onclick = async () => {
    const email = emailEl.value.trim();
    const pass = passEl.value;
    const name = card.querySelector('#auth-name')?.value.trim();
    if (!email || !pass) { authError = 'Please fill in all fields.'; render(); return; }
    authLoading = true; authError = ''; render();
    try {
      if (authTab === 'login') {
        await signInWithEmailAndPassword(auth, email, pass);
      } else {
        if (!name) { authError = 'Enter a display name.'; authLoading=false; render(); return; }
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        await updateProfile(cred.user, { displayName: name });
        await setDoc(doc(db, 'users', cred.user.uid), {
          uid: cred.user.uid,
          displayName: name,
          email,
          createdAt: serverTimestamp(),
          online: true,
          lastSeen: serverTimestamp()
        });
      }
    } catch(e) {
      authError = firebaseErrMsg(e.code);
      authLoading = false;
      render();
    }
  };

  // Enter key
  [emailEl, passEl].forEach(el => el && el.addEventListener('keydown', e => {
    if (e.key === 'Enter') card.querySelector('#auth-submit').click();
  }));
}

function firebaseErrMsg(code) {
  const map = {
    'auth/user-not-found': 'No account found with that email.',
    'auth/wrong-password': 'Incorrect password.',
    'auth/email-already-in-use': 'Email already registered.',
    'auth/weak-password': 'Password must be at least 6 characters.',
    'auth/invalid-email': 'Invalid email address.',
    'auth/too-many-requests': 'Too many attempts. Please try again later.',
    'auth/invalid-credential': 'Invalid email or password.',
  };
  return map[code] || `Error: ${code}`;
}

function renderConvoItem(c) {
  const other = getOtherParticipant(c);
  const isActive = c.id === activeConvoId;
  const preview = c.lastMessage ? truncate(c.lastMessage, 38) : 'Start the conversation…';
  const time = c.lastMessageAt ? formatTime(c.lastMessageAt.toDate?.() || new Date(c.lastMessageAt)) : '';
  const unread = c.unreadCounts?.[currentUser.uid] || 0;
  return `
    <div class="chat-item ${isActive?'active':''}" data-convo="${c.id}">
      <div class="chat-avatar" style="${avatarColor(other.name)}">
        ${initials(other.name)}

function renderMessages() {
  if (messages.length === 0) {
    return `<div style="text-align:center;color:var(--text3);font-size:13px;padding:20px;">Send the first message!</div>`;
  }

  let html = '';
  let lastDate = '';

  messages.forEach((msg, i) => {
    const isOut = msg.senderId === currentUser.uid;
    const ts = msg.createdAt?.toDate?.() || new Date(msg.createdAt || Date.now());
    const dateStr = ts.toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
    const today = new Date().toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });
    const yesterday = new Date(Date.now()-86400000).toLocaleDateString(undefined, { weekday:'long', month:'short', day:'numeric' });

    if (dateStr !== lastDate) {
      lastDate = dateStr;
      const label = dateStr === today ? 'Today' : dateStr === yesterday ? 'Yesterday' : dateStr;
      html += `<div class="date-divider"><span>${label}</span></div>`;
    }

    const prevMsg = messages[i-1];
    const showAvatar = !isOut && (!prevMsg || prevMsg.senderId !== msg.senderId);
    const showName = showAvatar;

    html += `
      <div class="msg-row ${isOut?'out':'in'}">
        ${!isOut ? `
          <div class="msg-avatar-space">
            ${showAvatar ? `<div class="msg-sender-avatar" style="${avatarColor(msg.senderName)}">${initials(msg.senderName)}</div>` : ''}
          </div>
        ` : ''}
        <div class="msg-bubble-wrap">
          ${showName && !isOut ? `<div class="msg-sender-name">${esc(msg.senderName)}</div>` : ''}
          <div class="msg-bubble">${esc(msg.text)}</div>
          <div class="msg-meta">
            <span>${formatMsgTime(ts)}</span>
            ${isOut ? `<span class="msg-status ${msg.read?'read':'sent'}">${msg.read?'✓✓':'✓'}</span>` : ''}
          </div>
        </div>
      </div>`;
  });

  return html;
}

// ── Bind events ───────────────────────────────────────────────────────────
function bindAppEvents() {
  // Profile menu
  const profileBtn = document.getElementById('profile-btn');
  if (profileBtn) profileBtn.onclick = (e) => {
    e.stopPropagation();
    profileMenuOpen = !profileMenuOpen;
    render();
  };
  document.getElementById('pm-profile')?.addEventListener('click', () => {
    profileMenuOpen = false; showProfile = true; render();
  });
  document.getElementById('pm-signout')?.addEventListener('click', async () => {
    profileMenuOpen = false;
    await setPresence(false);
    await signOut(auth);
  });

  // Close profile menu on click outside
  document.addEventListener('click', closeProfileMenu, { once: true });

  // Convo items
  document.querySelectorAll('.chat-item').forEach(el => {
    el.onclick = () => openConvo(el.dataset.convo);
  });

  // New chat
  document.getElementById('new-chat-btn')?.addEventListener('click', () => {
    showNewChat = true; render();
  });

  // New chat modal
  document.getElementById('new-chat-cancel')?.addEventListener('click', () => {
    showNewChat = false; render();
  });
  document.getElementById('new-chat-go')?.addEventListener('click', startNewChat);
  document.getElementById('overlay')?.addEventListener('click', (e) => {
    if (e.target.id === 'overlay') {
      showNewChat = false; showProfile = false; render();
    }
  });
  document.getElementById('new-chat-uid')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') startNewChat();
  });

  // Profile modal
  document.getElementById('profile-close')?.addEventListener('click', () => {
    showProfile = false; render();
  });
  document.getElementById('copy-uid')?.addEventListener('click', () => {
    copyToClipboard(currentUser.uid, 'User ID copied!');
  });
  document.getElementById('profile-save')?.addEventListener('click', saveProfile);

  // Chat actions
  document.getElementById('back-btn')?.addEventListener('click', () => {
    showMobileChat = false; render();
  });
  document.getElementById('copy-uid-btn')?.addEventListener('click', () => {
    const convo = conversations.find(c => c.id === activeConvoId);
    if (!convo) return;
    const other = getOtherParticipant(convo);
    copyToClipboard(other.uid, 'Their UID copied!');
  });

  // Message input
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  if (msgInput) {
    msgInput.addEventListener('input', () => {
      // Auto-resize
      msgInput.style.height = 'auto';
      msgInput.style.height = Math.min(msgInput.scrollHeight, 130) + 'px';
      sendBtn.disabled = !msgInput.value.trim();
      updateTyping(!!msgInput.value.trim());
    });
    msgInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendMessage();
      }
    });
  }
  sendBtn?.addEventListener('click', sendMessage);

  // Search
  document.getElementById('search-input')?.addEventListener('input', e => {
    filterConversations(e.target.value);
  });

  // Scroll to bottom
  scrollToBottom();
}

function closeProfileMenu() {
  if (profileMenuOpen) { profileMenuOpen = false; render(); }
}

// ── Conversations ─────────────────────────────────────────────────────────
function subscribeConversations() {
  if (unsubConvos) unsubConvos();
  const q = query(
    collection(db, 'conversations'),
    where('participants', 'array-contains', currentUser.uid),
    orderBy('lastMessageAt', 'desc')
  );
  unsubConvos = onSnapshot(q, async (snap) => {
    const convos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // Fetch other user profiles
    const uids = [...new Set(convos.flatMap(c => c.participants).filter(uid => uid !== currentUser.uid))];
    const profiles = await fetchUserProfiles(uids);
    conversations = convos.map(c => {
      const otherUid = c.participants.find(uid => uid !== currentUser.uid);
      const profile = profiles[otherUid] || { uid: otherUid, displayName: 'Unknown', online: false };
      return { ...c, otherProfile: profile };
    });
    render();
  });
}

async function fetchUserProfiles(uids) {
  const result = {};
  await Promise.all(uids.map(async uid => {
    try {
      const snap = await getDoc(doc(db, 'users', uid));
      if (snap.exists()) result[uid] = snap.data();
    } catch(e) {}
  }));
  return result;
}

function getOtherParticipant(convo) {
  if (convo.otherProfile) {
    return {
      uid: convo.otherProfile.uid,
      name: convo.otherProfile.displayName || 'Unknown',
      online: convo.otherProfile.online || false,
      lastSeen: convo.otherProfile.lastSeen
    };
  }
  return { uid: '', name: 'Unknown', online: false };
}

async function openConvo(convoId) {
  activeConvoId = convoId;
  showMobileChat = true;
  profileMenuOpen = false;

  // Clear unread
  const convo = conversations.find(c => c.id === convoId);
  if (convo && convo.unreadCounts?.[currentUser.uid] > 0) {
    try {
      await updateDoc(doc(db, 'conversations', convoId), {
        [`unreadCounts.${currentUser.uid}`]: 0
      });
    } catch(e) {}
  }

  render();
  subscribeMessages(convoId);
}

function filterConversations(q) {
  const term = q.toLowerCase();
  document.querySelectorAll('.chat-item').forEach(el => {
    const name = el.querySelector('.chat-name')?.textContent.toLowerCase() || '';
    el.style.display = name.includes(term) ? '' : 'none';
  });
}

// ── Start new chat ────────────────────────────────────────────────────────
async function startNewChat() {
  const uidInput = document.getElementById('new-chat-uid');
  const errorEl = document.getElementById('new-chat-error');
  const targetUid = uidInput?.value.trim();
  if (!targetUid) { showError(errorEl, 'Enter a User ID.'); return; }
  if (targetUid === currentUser.uid) { showError(errorEl, "That's your own ID!"); return; }

  const goBtn = document.getElementById('new-chat-go');
  goBtn.disabled = true;
  goBtn.innerHTML = '<span class="spinner"></span>';

  try {
    // Check user exists
    const userSnap = await getDoc(doc(db, 'users', targetUid));
    if (!userSnap.exists()) {
      showError(errorEl, 'No user found with that ID.');
      goBtn.disabled = false; goBtn.textContent = 'Start chat';
      return;
    }

    // Check for existing convo
    const existingConvo = conversations.find(c => c.participants.includes(targetUid));
    if (existingConvo) {
      showNewChat = false;
      await openConvo(existingConvo.id);
      return;
    }

    // Create new conversation
    const sortedParticipants = [currentUser.uid, targetUid].sort();
    const convoRef = await addDoc(collection(db, 'conversations'), {
      participants: sortedParticipants,
      participantNames: {
        [currentUser.uid]: currentUser.displayName || currentUser.email,
        [targetUid]: userSnap.data().displayName
      },
      createdAt: serverTimestamp(),
      lastMessageAt: serverTimestamp(),
      lastMessage: '',
      unreadCounts: { [currentUser.uid]: 0, [targetUid]: 0 }
    });

    showNewChat = false;
    await openConvo(convoRef.id);
  } catch(e) {
    showError(errorEl, 'Something went wrong: ' + e.message);
    goBtn.disabled = false; goBtn.textContent = 'Start chat';
  }
}

function showError(el, msg) {
  if (el) el.innerHTML = `<div class="error-msg">${msg}</div>`;
}

// ── Messages ──────────────────────────────────────────────────────────────
function subscribeMessages(convoId) {
  if (unsubMessages) unsubMessages();
  const q = query(
    collection(db, 'conversations', convoId, 'messages'),
    orderBy('createdAt', 'asc'),
    limit(80)
  );
  unsubMessages = onSnapshot(q, (snap) => {
    messages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    // Mark incoming as read
    markRead(convoId);
    const area = document.getElementById('messages-area');
    if (area) {
      const atBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 80;
      area.innerHTML = renderMessages();
      if (atBottom) scrollToBottom();
    }
  });
}

async function markRead(convoId) {
  try {
    const batch = writeBatch(db);
    const unread = messages.filter(m => m.senderId !== currentUser.uid && !m.read);
    unread.forEach(m => {
      batch.update(doc(db, 'conversations', convoId, 'messages', m.id), { read: true });
    });
    if (unread.length > 0) {
      batch.update(doc(db, 'conversations', convoId), {
        [`unreadCounts.${currentUser.uid}`]: 0
      });
    }
    await batch.commit();
  } catch(e) {}
}

async function sendMessage() {
  const msgInput = document.getElementById('msg-input');
  if (!msgInput) return;
  const text = msgInput.value.trim();
  if (!text || !activeConvoId) return;

  msgInput.value = '';
  msgInput.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  updateTyping(false);

  const convo = conversations.find(c => c.id === activeConvoId);
  const otherUid = convo?.participants.find(uid => uid !== currentUser.uid);

  try {
    const msgRef = await addDoc(collection(db, 'conversations', activeConvoId, 'messages'), {
      text,
      senderId: currentUser.uid,
      senderName: currentUser.displayName || currentUser.email,
      createdAt: serverTimestamp(),
      read: false
    });

    await updateDoc(doc(db, 'conversations', activeConvoId), {
      lastMessage: text,
      lastMessageAt: serverTimestamp(),
      ...(otherUid ? { [`unreadCounts.${otherUid}`]: increment(1) } : {})
    });
  } catch(e) {
    showToast('Failed to send: ' + e.message);
  }
}

// ── Typing indicator ──────────────────────────────────────────────────────
let typingTimeout = null;
async function updateTyping(isTyping) {
  if (!activeConvoId || !currentUser) return;
  try {
    await setDoc(doc(db, 'conversations', activeConvoId, 'typing', currentUser.uid), {
      uid: currentUser.uid,
      isTyping,
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch(e) {}

  if (typingTimeout) clearTimeout(typingTimeout);
  if (isTyping) {
    typingTimeout = setTimeout(() => updateTyping(false), 4000);
  }
}

// ── Presence ──────────────────────────────────────────────────────────────
async function setPresence(online) {
  if (!currentUser) return;
  try {
    await updateDoc(doc(db, 'users', currentUser.uid), {
      online,
      lastSeen: serverTimestamp()
    });
  } catch(e) {}
}

// ── Profile ───────────────────────────────────────────────────────────────
async function saveProfile() {
  const nameInput = document.getElementById('profile-name');
  const feedbackEl = document.getElementById('profile-feedback');
  const name = nameInput?.value.trim();
  if (!name) { showError(feedbackEl, 'Name cannot be empty.'); return; }

  const saveBtn = document.getElementById('profile-save');
  saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

  try {
    await updateProfile(auth.currentUser, { displayName: name });
    await updateDoc(doc(db, 'users', currentUser.uid), { displayName: name });
    if (feedbackEl) feedbackEl.innerHTML = `<div class="success-msg">✓ Name updated!</div>`;
    saveBtn.disabled = false; saveBtn.textContent = 'Save name';
  } catch(e) {
    showError(feedbackEl, 'Failed: ' + e.message);
    saveBtn.disabled = false; saveBtn.textContent = 'Save name';
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────
function scrollToBottom() {
  setTimeout(() => {
    const area = document.getElementById('messages-area');
    if (area) area.scrollTop = area.scrollHeight;
  }, 50);
}

function initials(name) {
  if (!name) return '?';
  const parts = name.trim().split(' ');
  return (parts[0][0] + (parts[1]?.[0] || '')).toUpperCase();
}

const COLORS = [
  'background:#3d3880;color:#b8b2ff;',
  'background:#2d4a3e;color:#7ecfaa;',
  'background:#4a2d3e;color:#cf7ea0;',
  'background:#3e3d2d;color:#cfc97e;',
  'background:#2d3e4a;color:#7eb8cf;',
  'background:#4a3d2d;color:#cfab7e;',
];
function avatarColor(name) {
  if (!name) return COLORS[0];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return COLORS[Math.abs(h) % COLORS.length];
}

function formatTime(date) {
  if (!date) return '';
  const now = new Date();
  const diff = now - date;
  if (diff < 86400000 && date.getDate() === now.getDate()) {
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  if (diff < 604800000) {
    return date.toLocaleDateString([], { weekday: 'short' });
  }
  return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function formatMsgTime(date) {
  return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function truncate(str, len) {
  return str.length > len ? str.slice(0, len) + '…' : str;
}

function esc(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function copyToClipboard(text, msg) {
  try {
    await navigator.clipboard.writeText(text);
    showToast(msg || 'Copied!');
  } catch(e) {
    showToast('Copy failed — please copy manually.');
  }
}

function showToast(msg) {
  toast = msg;
  if (toastTimer) clearTimeout(toastTimer);
  render();
  toastTimer = setTimeout(() => { toast = null; render(); }, 2500);
}

// ── Boot ──────────────────────────────────────────────────────────────────
if (!CONFIG_FILLED) {
  render();
} else {
  initFirebase();

  // Presence on window events
  window.addEventListener('beforeunload', () => setPresence(false));
  document.addEventListener('visibilitychange', () => {
    setPresence(!document.hidden);
  });

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      // Ensure user doc exists
      const userDoc = await getDoc(doc(db, 'users', user.uid));
      if (!userDoc.exists()) {
        await setDoc(doc(db, 'users', user.uid), {
          uid: user.uid,
          displayName: user.displayName || user.email,
          email: user.email,
          createdAt: serverTimestamp(),
          online: true,
          lastSeen: serverTimestamp()
        });
      } else {
        await updateDoc(doc(db, 'users', user.uid), { online: true, lastSeen: serverTimestamp() });
      }
      subscribeConversations();
    } else {
      currentUser = null;
      if (unsubConvos) { unsubConvos(); unsubConvos = null; }
      if (unsubMessages) { unsubMessages(); unsubMessages = null; }
      conversations = []; messages = []; activeConvoId = null;
      render();
    }
  });
}
</script>
