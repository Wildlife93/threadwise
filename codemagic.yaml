workflows:
  android-workflow:
    name: Threadwise Android
    max_build_duration: 60
    environment:
      node: 18
      java: 21
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor CLI
        script: npm install @capacitor/cli @capacitor/core @capacitor/android
      - name: Capacitor sync
        script: ./node_modules/.bin/cap sync android
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
